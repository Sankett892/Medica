openapi: 3.0.3
info:
  title: HackMatrix Healthcare Platform API
  description: >
    Production-style backend for the HackMatrix healthcare platform.
    Authoritative for identity, role-based access control, consent grants,
    QR-based clinical identification, break-glass emergency access, and
    privacy-preserving k-anonymized public health surveillance.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api/v1
    description: Local development server
paths:
  /auth/me:
    get:
      summary: Get current authenticated identity, role, and organization
      security:
        - BearerAuth: []
        - DevPreviewAuth: []
      responses:
        '200':
          description: Authenticated identity payload
        '401':
          description: Unauthenticated or expired session

  /auth/sync-user:
    post:
      summary: Upsert local user record on login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clerkUserId, email, name]
              properties:
                clerkUserId: { type: string }
                email: { type: string }
                name: { type: string }
                role: { type: string, enum: [PATIENT, CLINICIAN, ADMIN] }
                orgId: { type: string }
      responses:
        '201':
          description: User synchronized

  /patients/me:
    get:
      summary: Get patient self profile
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Patient profile }
    patch:
      summary: Update patient contact or emergency information
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Patient updated }

  /patients/me/summary:
    get:
      summary: Patient home dashboard payload (profile, vitals, activity, active grants count)
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Dashboard summary }

  /patients/me/records:
    get:
      summary: Patient self clinical records with category and text filters
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: cat
          in: query
          schema: { type: string, enum: [all, encounters, observations, medications, allergies, reports, immunizations, careplans] }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200': { description: List of clinical records }

  /patients/me/records/{id}:
    get:
      summary: Single record detail
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Clinical record detail }

  /patients/me/vitals:
    get:
      summary: Patient vital signs indicators
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Array of vital signs }

  /patients/me/activity:
    get:
      summary: Recent access timeline
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Access timeline items }

  /patients/me/grants:
    get:
      summary: Patient consent grants list
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: tab
          in: query
          schema: { type: string, enum: [active, pending, closed] }
      responses:
        '200': { description: List of consent grants }
    post:
      summary: Create a scoped, time-limited consent grant
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [recipient, role, org, scope, purpose]
              properties:
                recipient: { type: string }
                role: { type: string }
                org: { type: string }
                scope: { type: array, items: { type: string } }
                purpose: { type: string }
                validityDays: { type: integer, default: 30 }
      responses:
        '201': { description: Grant created }

  /patients/me/grants/{id}:
    get:
      summary: Get consent grant details
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Consent grant detail }

  /patients/me/grants/{id}/revoke:
    post:
      summary: Revoke an active consent grant
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Grant revoked }

  /patients/me/qr:
    post:
      summary: Generate a short-lived QR token (5-minute TTL)
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: QR authorization token }

  /patients/me/qr/refresh:
    post:
      summary: Refresh short-lived QR token
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Refreshed QR token }

  /clinicians/me:
    get:
      summary: Clinician profile & credential
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Clinician profile }

  /clinicians/dashboard:
    get:
      summary: Clinician dashboard metrics, activity, and pending requests
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Clinician dashboard summary }

  /clinicians/patients:
    get:
      summary: Search authorized patients within clinician's organization
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        '200': { description: List of authorized patients }

  /clinicians/patients/{id}:
    get:
      summary: Get patient summary; validates consent grant or emergency access
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Patient identification and authorized scope }
        '403': { description: Denied - No active consent }

  /clinicians/patients/{id}/records:
    get:
      summary: Retrieve patient clinical records strictly scoped to authorized categories
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Filtered clinical records }
        '403': { description: Denied - No active consent }

  /clinicians/qr/resolve:
    post:
      summary: Resolve scanned QR token to patient; validates TTL, role, and burns token
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Resolved patient }
        '404': { description: Invalid token }
        '409': { description: Token already used }
        '410': { description: Token expired }

  /clinicians/emergency:
    post:
      summary: Break-glass emergency access; requires justification >= 10 chars
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [patient, justification]
              properties:
                patient: { type: string }
                justification: { type: string, minLength: 10 }
      responses:
        '201': { description: Emergency access granted and logged }
        '400': { description: Validation error }

  /admin/overview:
    get:
      summary: Privacy-preserving aggregate surveillance overview
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      responses:
        '200': { description: Overview metrics and trends }

  /admin/surveillance:
    get:
      summary: Disease surveillance with observed vs forecast trends
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: disease
          in: query
          schema: { type: string, enum: [ili, dengue, add] }
        - name: period
          in: query
          schema: { type: integer, enum: [7, 14, 30] }
      responses:
        '200': { description: Surveillance trends }

  /admin/geographic:
    get:
      summary: Regional case counts enforcing k-anonymity suppression
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: k
          in: query
          schema: { type: integer }
      responses:
        '200': { description: K-anonymized regional distribution }

  /admin/privacy:
    get:
      summary: Privacy threshold simulation and de-identification status
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: threshold
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Privacy threshold simulation }

  /admin/audit:
    get:
      summary: Read-only system audit log viewer
      security: [{ BearerAuth: [] }, { DevPreviewAuth: [] }]
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer }
      responses:
        '200': { description: Immutable audit events }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    DevPreviewAuth:
      type: apiKey
      in: header
      name: x-dev-user-id
      description: Non-production preview mode identity resolver
